<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Tower</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
        }
        #diceResult {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 32px;
            font-family: Arial, sans-serif;
            z-index: 1000;
        }
        #diceHistory {

            position: absolute;

            top: 70px;
            left: 20px;

            width: 180px;
            height: 200px;

            background: rgba(20,20,20,0.85);

            color: white;
            font-family: Arial;
            font-size: 16px;

            padding: 10px;

            border-radius: 10px;

            overflow-y: auto;

            z-index: 1000;
        }
        #menu{
            position:absolute;
            top:20px;
            right:20px;

            background:rgba(20,20,20,0.85);

            padding:15px;
            border-radius:12px;

            display:flex;
            flex-direction:column;
            gap:10px;

            color:white;
            font-family:Arial;

            z-index:1000;
        }

        .mainButton{
            padding:10px;
            font-size:16px;
            cursor:pointer;
        }

        .themeRow{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:15px;
        }

        .themeBtn{
            width:20px;
            height:20px;
            border-radius:50%;
            border:2px solid white;
            background:transparent;
            cursor:pointer;
        }

        .themeBtn.active{
            background:white;
        }

        .diceBtn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
        }
        #zargosMenu{
            margin-top:8px;
            padding:8px;

            background:rgba(0,0,0,0.3);
            border-radius:8px;

            display:flex;
            flex-direction:column;
            gap:6px;

            width:150px;
        }

        #zargosMenu button{
            width:100%;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.181.1/build/three.module.js",
            "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    
    </script>
</head>

<body>
    
        <div id="diceResult"
        style="
            position:absolute;
            top:20px;
            left:20px;
            font-size:30px;
            color:white;
            font-family:Arial;
            z-index:1000;
        ">
        -
    </div>

    <div id="diceHistory">

    </div>
        <script type="module" src="./js/main.js"></script>
        <div id="menu">

            <button id="dropD6" class="mainButton">
                Fai cadere il d6
            </button>
            <div id="zargosMenu" style="display:none; flex-direction:column;">
                <button id="dropD8" class="mainButton">
                    Fai cadere il d8
                </button>
                <button id="dropD12" class="mainButton">
                    Fai cadere il d12
                </button>
                <button id="dropD20" class="mainButton">
                    Fai cadere il d20
                </button>
            </div>
            <!-- <button id="dropD12" class="mainButton">
                Fai cadere il d12
            </button>
            <button id="dropD20" class="mainButton">
                Fai cadere il d20
            </button>

            <!-- TEMI -->
            <div class="themeRow">
                <span>Medieval</span>
                <button class="themeBtn active" data-theme="medieval"></button>
            </div>

            <div class="themeRow">
                <span>Ice</span>
                <button class="themeBtn" data-theme="ice"></button>
            </div>

            <div class="themeRow">
                <span>Rust</span>
                <button class="themeBtn" data-theme="madmax"></button>
            </div>

            <div class="themeRow">
                <span>Cyber</span>
                <button class="themeBtn" data-theme="cyber"></button>
            </div>
            <button id="zargosMode">Zargos Mode</button>
    </div>
    
</body>
</html>
